services:
  picoclaw:
    image: crpi-3cv0rta9jago3ag6.cn-hangzhou.personal.cr.aliyuncs.com/changingstudy/picoclaw-full:latest
    container_name: picoclaw
    restart: unless-stopped
    environment:
      - PICOCLAW_GATEWAY_HOST=0.0.0.0
      # Set a fixed dashboard token instead of a random one each restart.
      # If not set, a random token is generated and printed to the console on startup.
      #- PICOCLAW_LAUNCHER_TOKEN=your-secret-token-here
    ports:
      - "18800:18800"   # WebUI
      - "18790:18790"   # Gateway API
    volumes:
      - ./data:/root/.picoclaw
