# Matrix Stack - Synapse Homeserver + Ketesa Admin + Element Web
#
# Usage:
#   ./start.sh    - Generate configs and start services
#   ./stop.sh     - Stop services
#   docker compose logs - View logs
#
# DO NOT run docker compose up directly - use start.sh instead

services:
  # Matrix database
  matrix-postgres:
    image: postgres:15-alpine
    container_name: matrix-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - matrix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Synapse Homeserver
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    ports:
      - "${SYNAPSE_HTTP_PORT:-8008}:8008"
      - "${SYNAPSE_HTTPS_PORT:-8448}:8448"
    volumes:
      - ./config:/data
    networks:
      - matrix-net
    depends_on:
      matrix-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Ketesa Admin UI
  ketesa:
    image: ghcr.io/etkecc/ketesa:latest
    container_name: matrix-ketesa
    ports:
      - "${KETESA_PORT:-8011}:8080"
    volumes:
      - ./config/ketesa-config.json:/var/public/config.json:ro
    networks:
      - matrix-net
    depends_on:
      synapse:
        condition: service_healthy
    restart: unless-stopped

  # Element Web Client
  element-web:
    image: vectorim/element-web:v1.11.58
    container_name: matrix-element-web
    ports:
      - "${ELEMENT_PORT:-8010}:80"
    networks:
      - matrix-net
    depends_on:
      - synapse
    volumes:
      - ./config/element-config.json:/app/config.json:ro
    restart: unless-stopped

networks:
  matrix-net:
    driver: bridge
